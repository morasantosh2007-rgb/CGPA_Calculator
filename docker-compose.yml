version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gradenexus_db
    environment:
      POSTGRES_DB: gradenexus_db
      POSTGRES_USER: gradenexus_user
      POSTGRES_PASSWORD: gradenexus_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: gradenexus_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gradenexus_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=gradenexus-production-secure-key-2026
      - DEBUG=1
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gradenexus_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
