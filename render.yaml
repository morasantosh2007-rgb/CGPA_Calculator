services:
  - type: web
    name: gradenexus-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/
    envVars:
      - key: PORT
        value: 10000
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: PYTHONUNBUFFERED
        value: "1"
